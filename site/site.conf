# Read by tools/site.sh (key=value, never run as shell). See flarepress AGENTS.md, App sites.
url=https://isopix.app
committed=web worker site
pwa=1
# version.js names the service worker's cache: installed apps need this commit's copy.
compare=version.js
compare_wait=180
version_wait=90
rollback=redeploy
# One version string for a release: v<release>-<short commit> (v1.2.174-dce9c71), not git describe.
release=web/version.js
