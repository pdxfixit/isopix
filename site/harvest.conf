# Read by flarepress tools/harvest.py (key=value, never run as shell). See flarepress AGENTS.md, Telemetry harvest.
# The telemetry runner (pdxfixit/telemetry) is the only harvester: it runs this
# daily with its own read-only token and the `isopix` database id as
# D1_DATABASE_ID (site/wrangler.toml names it ${D1_DATABASE_ID}).
analytics=1
# One row per visit (worker/schema.sql), replaced as the visit sends its
# tally: the latest copy wins, keyed by the visit's own random id.
table=visits upsert visit
