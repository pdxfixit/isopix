# just land (flarepress tools/land.sh): what a landing on main runs here.
# after_pick: a release commit's PATCH is its commit count, which a landing on a newer main moves.
# version_bumped.sh: a pick whose version.js edit matched main's lands with no bump, and --restamp skips it (2026-10-19).
test=just test && tools/version_bumped.sh
resolve=TODO.md:todo docs/*.md:words AGENTS.md:words README.md:words
after_pick=python3 tools/bump_version.py --restamp
after=just live
