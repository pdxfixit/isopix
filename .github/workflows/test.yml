# Tests on every push and pull request. No secrets. Deploys are deploy.yml's,
# which waits for this run (every job) to be green on its commit.
#
# Two jobs run at once on their own runners: `test` (just test, the version
# checks and the other headless-Chrome checks) and `look` (the look checks, wide
# and short, each split into 4 shards at once by just look-ci). A push or pull
# request that changes only docs (tools/ci_scope.py) runs just test and the
# version checks and skips the browser checks (owner, 2026-10-20).
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version-bump rule and the docs-only check read history
      - name: Docs only? (tools/ci_scope.py)
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci_scope.py "$BASE"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install just (pinned release; Ubuntu's is too old for [positional-arguments])
        run: curl -sSfL https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin just && just --version
      - name: Engine tests (just test)
        run: just test
      - name: web/version.js bumped after the last change to web/
        run: tools/version_bumped.sh
      - name: web/version.js PATCH is the commit count of its commit
        run: python3 tools/bump_version.py --check
      - name: Output round trip (just export-check)
        if: steps.scope.outputs.browser == 'true'
        run: just export-check --out shots/export
      - name: Moving house (just move-check)
        if: steps.scope.outputs.browser == 'true'
        run: just move-check
      - name: Installable as an app (just install-check)
        if: steps.scope.outputs.browser == 'true'
        run: just install-check
      - name: Autosave copies (just autosave-check)
        if: steps.scope.outputs.browser == 'true'
        run: just autosave-check
      - name: Upload screenshots
        if: always() && steps.scope.outputs.browser == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-export
          path: shots/
          if-no-files-found: ignore

  # wide: every view at 320, 375, 700, 900 and 1100 px in light mode. short: a
  # landscape phone with the browser bars showing (480, 568, 844 × 320), where the
  # side rails must clear the bottom row and the update bar keep between the rails.
      - name: Report
        if: always()
        continue-on-error: true
        uses: pdxfixit/flarepress/ci@v1
        with:
          status: ${{ job.status }}
          endpoint: ${{ vars.CI_ENDPOINT }}
          key: ${{ secrets.CI_EVENTS_KEY }}
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
  look:
    name: look (${{ matrix.pass }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false  # a red wide pass still shows what short finds
      matrix:
        pass: [wide, short]
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the docs-only check reads history
      - name: Docs only? (tools/ci_scope.py)
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci_scope.py "$BASE"
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.browser == 'true'
        with:
          node-version-file: .node-version
      - name: Install just (pinned release; Ubuntu's is too old for [positional-arguments])
        if: steps.scope.outputs.browser == 'true'
        run: curl -sSfL https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin just && just --version
      - name: Look checks, 4 shards at once (just look-ci)
        if: steps.scope.outputs.browser == 'true'
        run: just look-ci ${{ matrix.pass }}
      - name: Upload screenshots
        if: always() && steps.scope.outputs.browser == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-${{ matrix.pass }}
          path: shots/
          if-no-files-found: ignore
      - name: Report
        if: always()
        continue-on-error: true
        uses: pdxfixit/flarepress/ci@v1
        with:
          status: ${{ job.status }}
          endpoint: ${{ vars.CI_ENDPOINT }}
          key: ${{ secrets.CI_EVENTS_KEY }}
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
