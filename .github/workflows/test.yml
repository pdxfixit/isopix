# Tests on every push and pull request. No secrets. Deploys are deploy.yml's,
# which waits for this run to be green on its commit.
name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHROME: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0  # the version-bump rule reads history
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.11.0
      - name: Install just (pinned release; Ubuntu's is too old for [positional-arguments])
        run: curl -sSfL https://github.com/casey/just/releases/download/1.36.0/just-1.36.0-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin just && just --version
      - name: Engine tests (just test)
        run: just test
      - name: web/version.js bumped after the last change to web/
        run: tools/version_bumped.sh
      - name: web/version.js PATCH is the commit count of its commit
        run: python3 tools/bump_version.py --check
      - name: Output round trip (just export-check)
        run: just export-check --out shots/export
      - name: Moving house (just move-check)
        run: just move-check
      - name: Width check (just look)
        run: just look draw drawn select selmore rail zoom fit brushes settings settings-open-all drawing-sheet usage events drawing-new color-pick sheet-focus update updatesel protect hoverskip help move pinchpan save-file welcome welcome-first lesson lesson-end help-lessons name-roll loading loading-slow --light --out shots/look
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: shots/
          if-no-files-found: ignore
