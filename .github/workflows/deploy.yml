# Deploys https://isopix.app with this repo's own Cloudflare token: the same
# `just --yes deploy` the owner runs (tools/deploy.sh: check, which waits for
# test.yml to be green on this commit; gate; stamp; push through flarepress;
# verify, with `just look` on the live site). No agent holds a token.
#
# Runs on every push to main that changes web/, worker/ or site/ (a docs-only
# commit is not deployed: docs/decisions.md, Shipping), and by hand (Actions →
# deploy → Run workflow).
#
# Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: deploy
on:
  push:
    branches: [main]
    # site/harvest.conf is the telemetry runner's, not deployed: a deploy for it
    # would ship the same files and pop the update notice for nothing.
    paths: ['web/**', 'worker/**', 'site/**', '!site/harvest.conf']
  workflow_dispatch:
permissions:
  contents: read
  actions: read  # deploy-check reads this commit's test run with gh
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FLAREPRESS: ${{ github.workspace }}/.flarepress
      CHROME: /usr/bin/google-chrome
      # gh signed in as this run, so deploy-check reads the test run at 1,000 calls an hour;
      # unsigned it shared the runner IP's 60, ran out, and waited 20 minutes for a green run (2026-10-16).
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # git describe, and the version-bump rule, read history
      - uses: actions/checkout@v7
        with:
          repository: pdxfixit/flarepress
          ref: v1  # flarepress's rolling tag; the owner moves it to release
          path: .flarepress
      - uses: actions/setup-node@v7
        with:
          node-version: 22.11.0
      - name: Install just (pinned release)
        run: curl -sSfL https://github.com/casey/just/releases/download/1.36.0/just-1.36.0-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin just && just --version
      - name: just --yes deploy
        run: just --yes deploy
