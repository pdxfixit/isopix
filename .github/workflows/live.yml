# Daily: is https://isopix.app up and working? A down or broken site fails
# (after 3 retries, 20 s apart). Which version is live is not checked:
# deploy.yml deploys every push to main, and a failed deploy is its own red
# run. tools/live_check.py.
name: live
on:
  schedule:
    - cron: '17 15 * * *'  # daily, 08:17 Pacific (daylight time)
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Live site is up
        run: python3 tools/live_check.py
      - name: Report
        if: always()
        continue-on-error: true
        uses: pdxfixit/flarepress/ci@v1
        with:
          status: ${{ job.status }}
          endpoint: ${{ vars.CI_ENDPOINT }}
          key: ${{ secrets.CI_EVENTS_KEY }}
          ntfy-topic: ${{ secrets.NTFY_TOPIC }}
