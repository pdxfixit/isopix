# Daily: is https://isopix.app up, and does it serve main's
# web/version.js? A down or broken site fails (after 3 retries, 20 s apart);
# live behind main passes with a notice for the first hour after main's
# version.js changed (a deploy in flight), then fails. tools/live_check.py.
name: live
on:
  schedule:
    - cron: '17 15 * * *'  # daily, 08:17 Pacific (daylight time)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # when main's web/version.js last changed
      - name: Live site against main
        run: python3 tools/live_check.py
